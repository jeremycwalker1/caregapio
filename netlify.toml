[build]
  publish = "."
  command = "npm install && npm run build"

# Specific routes must come before the catch-all below.

[[redirects]]
  from = "/quest"
  to = "/quest.html"
  status = 200

[[redirects]]
  from = "/lab-ordering"
  to = "/lab-ordering.html"
  status = 200

[[redirects]]
  from = "/quest-thanks"
  to = "/quest-thanks.html"
  status = 200

[[redirects]]
  from = "/terms-of-use"
  to = "/terms-of-use.html"
  status = 200

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"
